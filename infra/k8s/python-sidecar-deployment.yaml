apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-inference-sidecar
  namespace: vanguard-core
  labels:
    app: inference-sidecar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-sidecar
  template:
    metadata:
      labels:
        app: inference-sidecar
    spec:
      serviceAccountName: sidecar-sa
      containers:
      - name: sidecar
        image: vanguard/inference-sidecar:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
        - name: lancedb-store
          mountPath: /root/.gemini/antigravity/lancedb_store
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: lancedb-store
        persistentVolumeClaim:
          claimName: lancedb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inference-sidecar-svc
  namespace: vanguard-core
spec:
  selector:
    app: inference-sidecar
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sidecar-hpa
  namespace: vanguard-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vanguard-inference-sidecar
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sidecar-network-policy
  namespace: vanguard-core
spec:
  podSelector:
    matchLabels:
      app: inference-sidecar
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gbrain-mcp # Only MCP can access the sidecar
    ports:
    - protocol: TCP
      port: 8000
